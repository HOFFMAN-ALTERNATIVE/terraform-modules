name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  fmt-lint:
    name: fmt · tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -recursive -check -diff
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: tflint (all modules + examples)
        run: |
          tflint --init
          tflint --recursive --format compact

  checkov:
    name: checkov (IaC security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install checkov==3.3.29
      - run: checkov -d modules --config-file .checkov.yaml --compact --quiet

  test:
    name: validate + test · ${{ matrix.dir }} · tf ${{ matrix.tf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [modules/naming, modules/network, modules/secure-bucket, examples/complete]
        tf: ["1.9.8", "1.12.2"]
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.tf }}
          terraform_wrapper: false
      - name: init (no backend, no credentials)
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false
      - name: validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate
      - name: terraform test (mocked providers)
        working-directory: ${{ matrix.dir }}
        run: terraform test -verbose
